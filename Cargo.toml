[workspace]
members = ["awf"]
resolver = "2"

[profile.dev]
# We prioritize compilation speed.
opt-level = 0
incremental = true
split-debuginfo = "unpacked"
debug = "line-tables-only" # Remove if running debugger

[profile.dev.package.backtrace]
opt-level = 3 # compile with optimizations even in dev profile for color-eyre.

[workspace.metadata.bin]
cargo-nextest = { version = "0.9.130", bins = ["cargo-nextest"] }
