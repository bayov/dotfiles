[settings]
default_target_type = "automatic"

[helpers]

[default]
depends = ["jj", "fish", "starship", "eza"]

[jj.files]
"config/jj" = "~/.config/jj"

[fish.files]
"config/fish" = { target = "~/.config/fish", type = "symbolic", recurse = false }

[starship.files]
"config/starship.toml" = "~/.config/starship.toml"

[eza.files]
"config/eza" = "~/.config/eza"

