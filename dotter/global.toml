[settings]
default_target_type = "automatic"

[helpers]

[default]
depends = [
    # directories
    "claude",
    "delta",
    "eza",
    "fish",
    "gemini",
    "jj",
    "nvim",
    "opencode",
    "wezterm",
    "zellij",
    # single files
    "gitconfig",
    "starship",
]

[claude.files]
"config/claude/CLAUDE.md" = "~/.claude/CLAUDE.md"
"config/claude/settings.json" = "~/.claude/settings.json"
"config/claude/keybindings.json" = "~/.claude/keybindings.json"
"config/claude/statusline.py" = "~/.claude/statusline.py"

[delta.files]
"config/delta" = "~/.config/delta"

[eza.files]
"config/eza" = "~/.config/eza"

[fish.files]
"config/fish" = { target = "~/.config/fish", type = "symbolic", recurse = false }

[gemini.files]
"config/gemini/AGENTS.md" = "~/.gemini/AGENTS.md"
"config/gemini/settings.json" = "~/.gemini/settings.json"
"config/gemini/policies" = { target = "~/.gemini/policies", type = "symbolic", recurse = false }

[jj.files]
"config/jj" = "~/.config/jj"

[nvim.files]
"config/nvim" = "~/.config/nvim"

[opencode.files]
"config/opencode/AGENTS.md" = "~/.config/opencode/AGENTS.md"
"config/opencode/opencode.jsonc" = "~/.config/opencode/opencode.jsonc"

[wezterm.files]
"config/wezterm" = { target = "/mnt/c/Users/hesos/.config/wezterm", type = "template" }

[zellij.files]
"config/zellij" = "~/.config/zellij"

[gitconfig.files]
"config/.gitconfig" = "~/.gitconfig"

[starship.files]
# Using template to force a copy, since we need to override right_prompt in
# Google environment.
"config/starship.toml" = { target = "~/.config/starship.toml", type = "template" }
