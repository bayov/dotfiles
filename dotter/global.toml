[settings]
default_target_type = "automatic"

[helpers]

[default]
depends = [
    # directories
    "claude",
    "Code",
    "delta",
    "eza",
    "fish",
    "fresh",
    "gemini",
    "jj",
    "opencode",
    "resources",
    "wezterm",
    "zellij",
    # single files
    "gitconfig",
    "srt-settings",
    "quick_prompt",
    "starship",
]

[claude.files]
"config/claude/CLAUDE.md" = "~/.claude/CLAUDE.md"
"config/claude/settings.json" = "~/.claude/settings.json"
"config/claude/keybindings.json" = "~/.claude/keybindings.json"
"config/claude/statusline.py" = "~/.claude/statusline.py"

[Code.files]
"config/Code/User/settings.json" = "~/.vscode-server/data/Machine/settings.json"
"config/Code/User/keybindings.json" = "~/.vscode-server/data/Machine/keybindings.json"

[delta.files]
"config/delta" = "~/.config/delta"

[eza.files]
"config/eza" = "~/.config/eza"

[fish.files]
"config/fish/config.fish" = "~/.config/fish/config.fish"
"config/fish/fish_plugins" = "~/.config/fish/fish_plugins"
"config/fish/completions" = { target = "~/.config/fish/completions", type = "symbolic", recurse = false }
"config/fish/conf.d" = { target = "~/.config/fish/conf.d", type = "symbolic", recurse = false }
"config/fish/functions" = { target = "~/.config/fish/functions", type = "symbolic", recurse = false }
"config/fish/themes" = { target = "~/.config/fish/themes", type = "symbolic", recurse = false }

[fresh.files]
"config/fresh" = { target = "~/.config/fresh", type = "symbolic", recurse = false }

[gemini.files]
"config/gemini/AGENTS.md" = "~/.gemini/AGENTS.md"
"config/gemini/settings.json" = "~/.gemini/settings.json"
"config/gemini/policies" = { target = "~/.gemini/policies", type = "symbolic", recurse = false }

[jj.files]
"config/jj" = "~/.config/jj"

[opencode.files]
"config/opencode/AGENTS.md" = "~/.config/opencode/AGENTS.md"
"config/opencode/opencode.jsonc" = "~/.config/opencode/opencode.jsonc"

[resources.files]
"config/resources" = { target = "~/.config/resources", type = "symbolic", recurse = false }

[wezterm.files]
"config/wezterm" = { target = "/mnt/c/Users/hesos/.config/wezterm", type = "template" }

[zellij.files]
"config/zellij" = "~/.config/zellij"

[gitconfig.files]
"config/.gitconfig" = "~/.gitconfig"

[srt-settings.files]
"config/.srt-settings.json" = "~/.srt-settings.json"

[quick_prompt.files]
"config/quick_prompt.py" = "~/.local/share/quick_prompt/quick_prompt.py"
"config/quick_prompt_models.json" = "~/.config/quick_prompt_models.json"

[starship.files]
# Using template to force a copy, since we need to override right_prompt in
# Google environment.
"config/starship.toml" = { target = "~/.config/starship.toml", type = "template" }
