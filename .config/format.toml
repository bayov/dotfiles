[[formatter]]
name = "fish_indent"
exts = [".fish"]
cmd = ["fish_indent", "--write"]
max_files_per_format = 20

[[formatter]]
name = "dprint"
exts = [
    ".md",
    ".py",
    ".json",
    ".jsonc",
    ".toml",
    ".yaml",
    ".yml",
    ".html",
    ".xml",
]
cmd = ["dprint", "fmt"]
max_files_per_format = 1000
