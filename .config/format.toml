[ignore]
exts = [".lock", ".lnk", ".ahk"]
shebangs = []

[[formatter]]
name = "shfmt"
exts = [".sh"]
cmd = ["shfmt", "--write"]
max_files_per_format = 20

[[formatter]]
name = "fish_indent"
exts = [".fish"]
cmd = ["fish_indent", "--write"]
max_files_per_format = 20

[[formatter]]
name = "stylua"
exts = [".lua"]
cmd = ["stylua", "--"]
max_files_per_format = 20

[[formatter]]
name = "dprint"
exts = [
    ".md",
    ".py",
    ".json",
    ".jsonc",
    ".toml",
    ".yaml",
    ".yml",
    ".html",
    ".xml",
]
shebangs = ["python3", "python"]
cmd = ["dprint", "fmt"]
max_files_per_format = 1000
