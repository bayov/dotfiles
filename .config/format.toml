[ignore]
exts = [
    ".lock",
    ".lnk",
    ".ahk",
    ".kdl",
    ".Dockerfile",
    ".gitconfig",
    ".awf_test",
]
globs = [
    "**/.gitignore",
    "**/.gitattributes",
    "**/.python-version",
    "**/.gitconfig",
    "**/.bayov-personal-project",
    "**/py.typed",
    "**/Code/User/keybindings.json",
    "**/zed/settings.json",
    "**/zed/keymap.json",
    "**/config/generate-commit-description-template.md",
]

[[formatter]]
name = "shfmt"
exts = [".sh"]
globs = ["**/.bashrc"]
cmd = ["shfmt", "--write"]
max_files_per_format = 20

[[formatter]]
name = "fish_indent"
exts = [".fish"]
cmd = ["fish_indent", "--write"]
max_files_per_format = 20

[[formatter]]
name = "stylua"
exts = [".lua"]
cmd = ["stylua", "--"]
max_files_per_format = 20

[[formatter]]
name = "dprint"
exts = [
    ".md",
    ".py",
    ".json",
    ".jsonc",
    ".toml",
    ".yaml",
    ".yml",
    ".html",
    ".xml",
]
cmd = ["dprint", "fmt"]
max_files_per_format = 1000

[[formatter]]
name = "rustfmt"
exts = [".rs"]
cmd = ["rustfmt"]
max_files_per_format = 20

[[formatter]]
name = "dprint-python-shebang"
exts = []
shebangs = ["python3", "python"]
cmd = ["dprint", "fmt", "--config", ".config/dprint-python.json"]
max_files_per_format = 1000
