version = 1
revision = 3
requires-python = ">=3.12"

[manifest]
members = [
    "dotfiles",
    "pybayov",
]

[[package]]
name = "dotfiles"
version = "0.1.0"
source = { virtual = "." }

[package.dev-dependencies]
dev = [
    { name = "pybayov" },
]

[package.metadata]

[package.metadata.requires-dev]
dev = [{ name = "pybayov", editable = "pybayov" }]

[[package]]
name = "pybayov"
version = "0.1.0"
source = { editable = "pybayov" }
