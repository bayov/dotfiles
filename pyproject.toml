[project]
name = "dotfiles"
version = "0.1.0"
requires-python = ">=3.11"

[dependency-groups]
dev = ["pyright", "ruff"]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with ruff formatter
    "ISC001", # conflicts with ruff formatter
    "D203", # conflicts with D211
    "D213", # conflicts with D212
]
