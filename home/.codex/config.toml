# Managed by dotfiles. Runtime state, auth, history, logs, and caches are not tracked.

model = "gpt-5.5"
model_reasoning_effort = "high"
approvals_reviewer = "guardian_subagent"
service_tier = "fast"

[features]
memories = true

[tui]
notification_condition = "always"

[tui.keymap.global]
copy = "ctrl-y"
clear_terminal = "ctrl-l"
open_external_editor = "alt-e"
open_transcript = "alt-v"
toggle_raw_output = "alt-shift-v"

[tui.keymap.chat]
increase_reasoning_effort = "alt-n"
decrease_reasoning_effort = "alt-shift-n"

[tui.keymap.composer]
history_search_previous = "ctrl-r"

[tui.keymap.editor]
delete_backward_word = ["ctrl-backspace", "alt-backspace", "ctrl-w"]
delete_forward_word = ["ctrl-delete", "alt-delete", "alt-d"]
kill_whole_line = "ctrl-x"

[projects."/Users/hagai.akibayov/dotfiles"]
trust_level = "trusted"

[plugins."slack@openai-curated"]
enabled = true

[plugins."sharepoint@openai-curated"]
enabled = true

[plugins."outlook-email@openai-curated"]
enabled = true

[plugins."outlook-calendar@openai-curated"]
enabled = true

[plugins."github@openai-curated"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."warp@claude-code-warp"]
enabled = true

[plugins."context7@claude-plugins-official"]
enabled = true

[plugins."skill-creator@claude-plugins-official"]
enabled = true

[marketplaces.openai-bundled]
source_type = "local"
source = "/Users/hagai.akibayov/.codex/.tmp/bundled-marketplaces/openai-bundled"

[marketplaces.openai-primary-runtime]
source_type = "local"
source = "/Users/hagai.akibayov/.cache/codex-runtimes/codex-primary-runtime/plugins/openai-primary-runtime"

