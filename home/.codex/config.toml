# Managed by dotfiles. Runtime state, auth, history, logs, and caches are not tracked.

model = "gpt-5.5"
model_reasoning_effort = "xhigh"
approvals_reviewer = "guardian_subagent"
service_tier = "fast"

[features]
memories = true
terminal_resize_reflow = true
prevent_idle_sleep = true

[tui]
notification_condition = "always"
status_line = ["current-dir", "model-with-reasoning", "used-tokens"]
status_line_use_colors = true

[tui.keymap.global]
copy = "ctrl-y"
clear_terminal = "ctrl-l"
open_external_editor = "alt-e"
open_transcript = "alt-v"
toggle_raw_output = "alt-shift-v"
toggle_fast_mode = "alt-shift-m"

[tui.keymap.chat]
increase_reasoning_effort = "alt-n"
decrease_reasoning_effort = "alt-shift-n"

[tui.keymap.editor]
kill_whole_line = "ctrl-x"
yank = []

[tui.keymap.pager]
page_up = []
page_down = []
half_page_up = "page-up"
half_page_down = "page-down"

[tui.model_availability_nux]
"gpt-5.5" = 4

[notice]
fast_default_opt_out = true

[projects."/Users/hagai.akibayov/dotfiles"]
trust_level = "trusted"

[plugins."slack@openai-curated"]
enabled = true

[plugins."sharepoint@openai-curated"]
enabled = false

[plugins."outlook-email@openai-curated"]
enabled = false

[plugins."outlook-calendar@openai-curated"]
enabled = false

[plugins."github@openai-curated"]
enabled = false

[plugins."browser@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."warp@claude-code-warp"]
enabled = true

[plugins."context7@claude-plugins-official"]
enabled = true

[plugins."gopls-lsp@claude-plugins-official"]
enabled = true

[marketplaces.openai-bundled]
source_type = "local"
source = "/Users/hagai.akibayov/.codex/.tmp/bundled-marketplaces/openai-bundled"

[marketplaces.openai-primary-runtime]
source_type = "local"
source = "/Users/hagai.akibayov/.cache/codex-runtimes/codex-primary-runtime/plugins/openai-primary-runtime"

