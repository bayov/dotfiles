[[link]]
tags = ["!mac"]
linker = "spread"

# macOS Warp reads themes from ~/.warp/themes/ and stores other
# settings in defaults (not file-based), so only themes are linked.
[[link]]
tags = ["mac"]
src = "themes"
linker = "symlink"
dst = "~/.warp/themes"

[[link]]
tags = ["wsl"]
linker = "windows-symlink"
dst = "/mnt/c/Users/hesos/AppData/Local/warp/Warp/config"

[[link]]
tags = ["wsl"]
src = "themes"
linker = "windows-symlink"
dst = "/mnt/c/Users/hesos/AppData/Roaming/warp/Warp/data/themes"
