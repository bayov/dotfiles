[[link]]
tags = ["!mac"]
linker = "spread"

# macOS Warp reads config from ~/.warp/.
[[link]]
tags = ["mac"]
src = "themes"
linker = "symlink"
dst = "~/.warp/themes"

[[link]]
tags = ["mac"]
src = "settings.toml"
linker = "symlink"
dst = "~/.warp/settings.toml"

[[link]]
tags = ["mac"]
src = "keybindings.yaml"
linker = "symlink"
dst = "~/.warp/keybindings.yaml"

[[link]]
tags = ["wsl"]
linker = "windows-symlink"
dst = "/mnt/c/Users/hesos/AppData/Local/warp/Warp/config"

[[link]]
tags = ["wsl"]
src = "themes"
linker = "windows-symlink"
dst = "/mnt/c/Users/hesos/AppData/Roaming/warp/Warp/data/themes"
