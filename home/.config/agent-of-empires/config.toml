default_profile = ""

[theme]
name = ""
color_mode = "truecolor"
idle_decay_minutes = 0

[updates]
check_enabled = true
check_interval_hours = 24
notify_in_cli = true
web_poll_interval_minutes = 60

[worktree]
enabled = false
path_template = "../{repo-name}-worktrees/{branch}"
bare_repo_path_template = "./{branch}"
auto_cleanup = true
show_branch_in_tui = true
delete_branch_on_cleanup = false
workspace_path_template = "../{branch}-workspace-{session-id}"
init_submodules = true

[sandbox]
enabled_by_default = false
default_image = "ghcr.io/njbrake/aoe-sandbox:latest"
extra_volumes = []
environment = [
    "TERM",
    "COLORTERM",
    "FORCE_COLOR",
    "NO_COLOR",
]
auto_cleanup = true
default_terminal_mode = "host"
volume_ignores = []
mount_ssh = false
container_runtime = "docker"

[tmux]
status_bar = "disabled"
mouse = "auto"
clipboard = "auto"

[session]
yolo_mode_default = false
agent_status_hooks = true
strict_hotkeys = false

[session.agent_extra_args]
claude = "--dangerously-skip-permissions"

[diff]
context_lines = 3

[hooks]

[sound]
enabled = false
mode = "random"

[app_state]
has_seen_welcome = true
last_seen_version = "1.7.0"
diff_file_list_width = 35
has_seen_custom_instruction_warning = false
has_acknowledged_agent_hooks = true
group_by = "project"
last_browse_dir = "/Users/hagai.akibayov/notes"

[web]
notifications_enabled = true
notify_on_waiting = true
notify_on_idle = false
notify_on_error = true
notify_on_wake_fire = true

[cockpit]
enabled = false
default_for_claude = true
default_agent = "aoe-agent"
max_concurrent_workers = 5
replay_events = 0
replay_bytes = 5242880
node_path = ""
show_tool_durations = true
queue_drain_mode = "combined"
max_concurrent_resumes = 4

[logging]
default_level = "info"

[logging.targets]
