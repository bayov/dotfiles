# For use as a remote VSCode configuration
linker = "spread"
dst = "~/.vscode-server/data/Machine"

# For use in Windows (WSL)

[[link]]
src = "keybindings.json"
linker = "windows-symlink"
dst = "/mnt/c/Users/hesos/AppData/Roaming/Code/User/keybindings.json"

[[link]]
src = "settings.json"
linker = "windows-symlink"
dst = "/mnt/c/Users/hesos/AppData/Roaming/Code/User/settings.json"
