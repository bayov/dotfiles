# ── True color passthrough ────────────────────────────────────────────────────
set -g  default-terminal    "tmux-256color"
set -as terminal-features   ",xterm-256color:RGB"
set -as terminal-features   ",xterm-256color:extkeys"
set -g  extended-keys       on

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status off
set -g status-style                   "bg=#16161d,fg=#aaacb2"

# ── Keybindings ───────────────────────────────────────────────────────────────
bind -n M-3 detach-client
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# ── Window tabs ───────────────────────────────────────────────────────────────
setw -g window-status-style           "bg=#16161d,fg=#aaacb2"
setw -g window-status-current-style   "bg=#273143,fg=#c8d6d5"
setw -g window-status-activity-style  "bg=#16161d,fg=#d8a657"

# ── Pane borders ──────────────────────────────────────────────────────────────
set -g pane-border-style        "fg=#4c4c4c"
set -g pane-active-border-style "fg=#7e868f"

# ── Command line / messages ───────────────────────────────────────────────────
set -g message-style         "bg=#273143,fg=#c8d6d5"
set -g message-command-style "bg=#273143,fg=#d8a657"

# ── Copy mode ─────────────────────────────────────────────────────────────────
setw -g mode-style "bg=#26498f,fg=#ffffff"
