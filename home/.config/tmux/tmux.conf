# ── True color passthrough ────────────────────────────────────────────────────
set -g  default-terminal    "tmux-256color"
set -as terminal-features   ",xterm-256color:RGB"
set -as terminal-features   ",xterm-256color:extkeys"
set -g  extended-keys       on

# ── Scrollback owned by WezTerm ───────────────────────────────────────────────
# Strip smcup/rmcup from the outer terminal capabilities so tmux does not
# put WezTerm into alt-screen on startup. All tmux output then stays in
# WezTerm's main scrollback, and WezTerm's Alt+Up/Down/PageUp/etc scroll
# its own buffer cursorlessly. KeyUnlessTui sees alt_screen=false inside
# tmux and lets the binds run.
set -ga terminal-overrides ',*:smcup@:rmcup@'

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status off
set -g status-style                   "bg=#16161d,fg=#aaacb2"

# ── Keybindings ───────────────────────────────────────────────────────────────
bind -n M-s detach-client
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# ── Scrolling & Scrollback (mirrors wezterm Alt bindings) ─────────────────────
bind -n M-Up    copy-mode \; send-keys -N 2 -X scroll-up
bind -n M-Down  copy-mode \; send-keys -N 2 -X scroll-down
bind -n M-PPage copy-mode \; send-keys -X halfpage-up
bind -n M-NPage copy-mode \; send-keys -X halfpage-down
bind -n M-Home  copy-mode \; send-keys -X history-top
bind -n M-End   copy-mode \; send-keys -X history-bottom
bind -n M-[     copy-mode \; send-keys -X previous-prompt
bind -n M-]     copy-mode \; send-keys -X next-prompt

# ── Window tabs ───────────────────────────────────────────────────────────────
setw -g window-status-style           "bg=#16161d,fg=#aaacb2"
setw -g window-status-current-style   "bg=#273143,fg=#c8d6d5"
setw -g window-status-activity-style  "bg=#16161d,fg=#d8a657"

# ── Pane borders ──────────────────────────────────────────────────────────────
set -g pane-border-style        "fg=#4c4c4c"
set -g pane-active-border-style "fg=#7e868f"

# ── Command line / messages ───────────────────────────────────────────────────
set -g message-style         "bg=#273143,fg=#c8d6d5"
set -g message-command-style "bg=#273143,fg=#d8a657"

# ── Copy mode ─────────────────────────────────────────────────────────────────
setw -g mode-style "bg=#26498f,fg=#ffffff"
