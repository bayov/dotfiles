"$schema" = 'https://starship.rs/config-schema.json'

format = '$cmd_duration$status$time$character'

# At Google, this takes too long. Disable and use a custom prompt
right_format = '${custom.google3_pwd}'

# Disable newline between commands
add_newline = false

[custom.google3_pwd]
command = 'prompt_pwd'
when = true
shell = ['/usr/bin/fish']
style = '#666666'

# Make the prompt a single liner
[line_break]
disabled = true

[time]
disabled = false
format = '[$time]($style) '
style = '#666666'

[cmd_duration]
min_time = 3_000
format = '''[took $duration](grey)
'''

[os]
disabled = true

[os.symbols]
Windows = "on [Windows](#4276d1)"
Ubuntu = "on [Ubuntu](#c65822)"

[git_branch]
symbol = ''

[git_status]
style = 'yellow'

[rust]
format = ''

