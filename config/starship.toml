"$schema" = "https://starship.rs/config-schema.json"

format = "$cmd_duration$status$time$character"

right_format = "$directory$custom"

# Disable newline between commands
add_newline = false

# Used only in Google configuration.
#
# The run_linux.sh script modifies `right_format` from
# "$all" to "${custom.google3_pwd}" when `--google` is
# provided.
[custom.google3_pwd]
command = "prompt_pwd"
when = true
shell = ["/usr/bin/fish"]
style = "#666666"

# Make the prompt a single liner
[line_break]
disabled = true

[time]
disabled = false
format = "[$time]($style) "
style = "#666666"

[cmd_duration]
min_time = 5_000
format = '''[took $duration](#666666)
'''

[os]
disabled = true

[os.symbols]
Windows = "on [Windows](#4276d1)"
Ubuntu = "on [Ubuntu](#c65822)"

[git_branch]
disabled = true

[git_status]
disabled = true

[custom.jj]
when = "jj-starship detect"
command = "jj-starship --jj-symbol ''"
format = "$output "
